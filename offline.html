<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Voice Translate AI — No Internet</title>
<meta name="theme-color" content="#0B0B14" />
<link rel="icon" href="/icon.png" type="image/png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0B0B14; color: #F1EFFA;
    font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .card { max-width: 380px; }
  .icon-wrap {
    width: 72px; height: 72px; border-radius: 999px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #2563EB, #9333EA);
    display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  h1 { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 800; margin: 0 0 10px; }
  p { color: #8B88A3; font-size: 14px; line-height: 1.6; margin: 0 0 26px; }
  button {
    padding: 14px 28px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #2563EB, #9333EA); color: #fff; font-weight: 700; font-size: 14.5px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">📡</div>
    <h1>Internet Connection Nahi Hai</h1>
    <p>Voice Translate AI ko kaam karne ke liye internet zaroori hai. Kripya apna Wi-Fi ya mobile data on karke dobara try karo.</p>
    <button onclick="window.location.reload()">Dobara Try Karo</button>
  </div>
</body>
</html>
